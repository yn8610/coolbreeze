<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920">
  <title>CoolBreeze Instagram story — full screen 1080x1920</title>
  <defs>
    <linearGradient id="storybg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E3B2E"/>
      <stop offset="1" stop-color="#1E6F50"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#storybg)"/>

  <!-- New logo (white for the dark background) -->
  <image xlink:href="logo-mark-white.svg" href="logo-mark-white.svg" x="90" y="90" width="470" height="128"/>

  <!-- Headline -->
  <text x="90" y="640" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="92" font-weight="800" fill="#FFFFFF">HOW MUCH IS YOUR</text>
  <text x="90" y="748" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="92" font-weight="800" fill="#FFFFFF">BUILDING PAYING</text>
  <text x="90" y="856" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="92" font-weight="800" fill="#3DA35D">TO STAY COOL?</text>
  <text x="92" y="980" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="54" font-weight="600" fill="#D9EBE0">Watch it drop with one tap.</text>

  <!-- Thermometer: full = waste, green = saving -->
  <g transform="translate(540,1250)">
    <rect x="-42" y="-500" width="84" height="600" rx="42" fill="none" stroke="#FFFFFF" stroke-width="12"/>
    <rect x="-28" y="-500" width="56" height="430" rx="28" fill="#3DA35D"/>
    <circle cy="130" r="70" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12"/>
    <circle cy="130" r="42" fill="#FFFFFF"/>
  </g>
  <text x="540" y="1490" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="middle">Less cooling, same comfort</text>

  <!-- CTA -->
  <rect x="120" y="1600" width="840" height="116" rx="58" fill="#3DA35D"/>
  <text x="540" y="1679" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="52" font-weight="800" fill="#0E3B2E" text-anchor="middle">TRY THE DEMO BUILDING</text>
  <text x="540" y="1790" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="34" font-weight="600" fill="#D9EBE0" text-anchor="middle">Free · No sign-up needed · 60 seconds</text>
  <text x="540" y="1856" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="30" font-weight="600" fill="#D9EBE0" text-anchor="middle">yn8610.github.io/coolbreeze</text>
</svg>