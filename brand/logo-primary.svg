<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <title>CoolBreeze logo — symbol + name</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E3B2E"/>
      <stop offset="1" stop-color="#1E6F50"/>
    </linearGradient>
    <clipPath id="fanclip">
      <circle cx="260" cy="200" r="135"/>
    </clipPath>
  </defs>

  <!-- Symbol: a cooling fan inside a rounded square tile -->
  <rect x="90" y="60" width="340" height="340" rx="72" fill="url(#tile)"/>
  <g clip-path="url(#fanclip)">
    <g transform="translate(260,200)">
      <ellipse cx="0" cy="55" rx="125" ry="42" fill="#FFFFFF" transform="rotate(0)"/>
      <ellipse cx="0" cy="55" rx="125" ry="42" fill="#FFFFFF" transform="rotate(120)"/>
      <ellipse cx="0" cy="55" rx="125" ry="42" fill="#FFFFFF" transform="rotate(240)"/>
    </g>
  </g>
  <!-- Fresh-mint sensor dot -->
  <circle cx="398" cy="92" r="20" fill="#3DA35D"/>

  <!-- Wordmark -->
  <text x="500" y="205" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="150" font-weight="800" fill="#0E3B2E">Cool</text>
  <text x="500" y="330" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="104" font-weight="700" fill="#1E6F50" letter-spacing="14">BREEZE</text>

  <!-- Tagline -->
  <text x="506" y="376" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="24" font-weight="600" fill="#131313" letter-spacing="4">LESS ELECTRICITY · NEVER LESS COMFORT</text>
</svg>