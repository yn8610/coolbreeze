<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <title>CoolBreeze Instagram post — square 1080x1080</title>
  <rect width="1080" height="1080" fill="#F4FAF6"/>

  <!-- Mini logo -->
  <text x="80" y="110" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="54" font-weight="800" fill="#0E3B2E">Cool</text>
  <text x="196" y="110" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="54" font-weight="700" fill="#1E6F50">Breeze</text>

  <!-- Sun -->
  <circle cx="820" cy="220" r="95" fill="#3DA35D"/>
  <g stroke="#3DA35D" stroke-width="14" stroke-linecap="round">
    <line x1="820" y1="80" x2="820" y2="52"/>
    <line x1="820" y1="360" x2="820" y2="388"/>
    <line x1="680" y1="220" x2="652" y2="220"/>
    <line x1="960" y1="220" x2="988" y2="220"/>
    <line x1="721" y1="121" x2="701" y2="101"/>
    <line x1="919" y1="319" x2="939" y2="339"/>
    <line x1="919" y1="121" x2="939" y2="101"/>
    <line x1="721" y1="319" x2="701" y2="339"/>
  </g>

  <!-- Cloud -->
  <g fill="#FFFFFF" stroke="#A8CBB8" stroke-width="8">
    <circle cx="330" cy="240" r="70"/>
    <circle cx="415" cy="205" r="90"/>
    <circle cx="505" cy="245" r="75"/>
    <rect x="310" y="240" width="215" height="75" rx="37"/>
  </g>

  <!-- Headline -->
  <text x="80" y="520" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="96" font-weight="800" fill="#0E3B2E">YOUR COOLING IS ON 24/7.</text>
  <text x="80" y="608" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="52" font-weight="600" fill="#131313">It only needs to run</text>
  <text x="80" y="668" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="52" font-weight="600" fill="#131313">when it’s hot.</text>

  <!-- Arrow down to savings -->
  <rect x="545" y="700" width="26" height="120" rx="13" fill="#1E6F50"/>
  <polygon points="558,850 512,786 604,786" fill="#1E6F50"/>

  <!-- Coin stack -->
  <circle cx="820" cy="760" r="78" fill="#0E3B2E"/>
  <circle cx="860" cy="830" r="72" fill="#1E6F50"/>
  <circle cx="888" cy="900" r="66" fill="#3DA35D"/>
  <text x="820" y="792" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="74" font-weight="800" fill="#FFFFFF" text-anchor="middle">₹</text>

  <!-- Caption -->
  <text x="80" y="920" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="40" font-weight="700" fill="#1E6F50">SAVINGS, APPLIED IN ONE TAP.</text>

  <!-- CTA -->
  <rect x="80" y="956" width="920" height="92" rx="46" fill="#1E6F50"/>
  <text x="540" y="1017" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" text-anchor="middle">TAP ONCE · SAVE EVERY MONTH</text>

  <text x="540" y="1070" font-family="'Avenir Next','Nunito','Poppins','Helvetica Neue',sans-serif" font-size="28" font-weight="600" fill="#4A6658" text-anchor="middle">yn8610.github.io/coolbreeze</text>
