<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <title>CoolBreeze plain logo — symbol only, single colour</title>
  <defs>
    <clipPath id="fanclip2">
      <circle cx="200" cy="200" r="118"/>
    </clipPath>
  </defs>

  <rect x="30" y="30" width="340" height="340" rx="72" fill="#0E3B2E"/>
  <g clip-path="url(#fanclip2)">
    <g transform="translate(200,200)">
      <ellipse cx="0" cy="48" rx="112" ry="38" fill="#FFFFFF" transform="rotate(0)"/>
      <ellipse cx="0" cy="48" rx="112" ry="38" fill="#FFFFFF" transform="rotate(120)"/>
      <ellipse cx="0" cy="48" rx="112" ry="38" fill="#FFFFFF" transform="rotate(240)"/>
    </g>
  </g>
  <circle cx="200" cy="200" r="20" fill="#0E3B2E"/>
</svg>